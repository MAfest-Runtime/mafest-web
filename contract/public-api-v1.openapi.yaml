openapi: 3.1.0
info:
  title: 금융상품 질의 검색 공개 API
  version: 1.4.0
  description: |
    mafest-web이 쓰는 공개 API(`/v1`). 사람이 읽는 설명은 mafest
    `docs/plans/39_공개API_명세.md`, 이 파일은 기계가 검사하는 정본이다.

    - 같은 origin. Traefik이 `/v1`을 mafest-api로 보낸다. CORS 없음.
    - 인증·쿠키 없음. 앱이 만든 모든 응답에 `X-Request-Id`(Traefik 429에는 없을 수 있다).
    - 도메인 키는 Evidence 계약 키(`bond kr_etf kr_etn xx_etf xx_etn fund`)만 쓴다.
      라우터 내부 이름(`etf_kr` 등)은 내보내지 않는다.
    - 응답 객체는 전부 `additionalProperties: false`이고 선언한 필드가 모두 필수다.
      웹 검사기(`validate.ts`)도 누락·추가 키를 똑같이 거절한다.
    - 이 파일을 고치면 mafest-web `src/lib/types.ts`·`validate.ts`와
      `contract.test.ts`(픽스처 ↔ 이 스키마, 깨진 응답 ↔ 두 검사기)가 함께 바뀌어야 한다.
    - 공개 trace·운영 로그 최소화 규칙은 `TraceStep.query` 설명과 39 §2-11을 따른다.
    - [r9] `POST /v1/search/stream`은 같은 결과를 SSE 이벤트로 나눠 보내고, 마지막 `done`에 SearchResponse 전체를 싣는다.
    - [1.4.0] `answer.text` 상한이 600자로 늘었다(문장 5개 상한은 그대로). `POST /v1/explain`은 검색과 별도로
      적용된 상품군·조건 축·정렬 축에 맞는 개념 설명(주제 0~2개)을 준다. 검색 `suggestions`와 섞지 않는다.
servers:
  - url: /
paths:
  /v1/search:
    post:
      operationId: search
      summary: 질문 하나를 해석·조회·생성해 답한다
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: outcome이 error가 아닌 모든 결과(answered … refused)
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "422":
          description: 질문이 비었거나 200자를 넘음, 본문이 JSON이 아님
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          description: |
            Traefik IP 요청 제한. 본문은 text/plain일 수 있고
            `request_id`·`X-Request-Id`를 보장하지 않는다.
          headers:
            Retry-After: { $ref: "#/components/headers/Retry-After" }
          content:
            text/plain:
              schema: { type: string }
        "500":
          description: |
            처리 중 예외. 본문은 반드시 outcome=error인 SearchResponse다
            (request_id·가능하면 trace 포함). 웹은 이 본문을 그대로 그린다.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "504":
          description: 전체 처리 시한(30초) 초과
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /v1/search/stream:
    post:
      operationId: searchStream
      summary: "[r9] /v1/search와 같은 처리를 SSE 이벤트로 나눠 보낸다"
      description: |
        이벤트 순서: start → interpretation → results → answer_delta(0개 이상) → answer_done →
        suggestions → done. 실패하면 그 자리에서 error 한 번 보내고 닫는다.
        각 이벤트의 data는 JSON이며 스키마는 아래와 같다(event 이름 → 스키마).
        start=StreamStart, interpretation=StreamInterpretation, results=StreamResults,
        answer_delta=StreamAnswerDelta, answer_done=StreamAnswerDone,
        suggestions=StreamSuggestions, done=StreamDone, error=ErrorBody.
        10초마다 SSE 주석 줄(`: ping`)을 보낸다. `done`의 response는 /v1/search 응답과 같은 스키마다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: 스트림 시작. 이후 실패는 error 이벤트로 알린다.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Cache-Control:
              schema: { const: no-store }
          content:
            text/event-stream:
              schema: { type: string }
        "422":
          description: 질문 형식 오류. 스트림을 열기 전에 일반 JSON 오류로 답한다.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          description: Traefik IP 요청 제한(/v1/search와 같은 묶음).
          headers:
            Retry-After: { $ref: "#/components/headers/Retry-After" }
          content:
            text/plain:
              schema: { type: string }

  /v1/products/{domain}/{product_id}:
    get:
      operationId: getProduct
      summary: 상품 상세(공개 허용 목록 컬럼만)
      parameters:
        - name: domain
          in: path
          required: true
          schema: { $ref: "#/components/schemas/DomainKey" }
        - name: product_id
          in: path
          required: true
          description: 검색 결과 `rows[].product_id` 그대로. 웹은 URL 인코딩해서 보낸다.
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: 상세
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Cache-Control:
              schema: { const: "public, max-age=300" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "404":
          description: "없는 도메인(code: unknown_domain) 또는 상품(code: product_not_found)"
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          description: IP 요청 제한(Traefik, 분당 30). 본문은 text/plain일 수 있다.
          headers:
            Retry-After: { $ref: "#/components/headers/Retry-After" }
        "500":
          description: "처리 중 예외(code: internal)"
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503":
          description: "DB 연결 오류·statement timeout(code: unavailable). 일시 장애"
          headers:
            Retry-After: { $ref: "#/components/headers/Retry-After" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /v1/meta:
    get:
      operationId: getMeta
      summary: 상품군별 건수·기준일, 예시 질문, 생성 모델 가용 여부
      description: |
        건수·기준일·예시는 기동 시 릴리스 manifest에서 읽어 둔다(요청마다 DB를 읽지 않는다).
        그래서 DB 장애와 무관하게 항상 200이다.
      responses:
        "200":
          description: 메타
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Cache-Control:
              schema: { const: "public, max-age=10" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }

  /v1/explain:
    post:
      operationId: explainConcepts
      summary: 검색에 적용된 상품군·조건 축·정렬 축에 맞는 개념 설명을 준다
      description: |
        [1.4.0] 검색 결과와 별도로 부르는 API다. 질문 원문은 보내지 않는다. 웹은 최종 검색 응답의
        `interpretation`에서 상품군·조건 축·정렬 축을 뽑아 보낸다. 서버는 검토된 설명 자료에서 주제를 고르고
        출처·검토일은 코드가 붙인다. 근거가 없으면 `topics`가 빈 배열인 정상 응답을 준다.
        설명 실패가 검색 결과를 실패시키지 않는다(웹은 설명 영역만 비운다).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExplainRequest" }
      responses:
        "200":
          description: 설명 주제 0~2개
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExplainResponse" }
        "422":
          description: 본문이 JSON이 아니거나 필드가 범위를 벗어남
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          description: Traefik IP 요청 제한. 본문은 text/plain일 수 있다.
          headers:
            Retry-After: { $ref: "#/components/headers/Retry-After" }
          content:
            text/plain:
              schema: { type: string }
        "500":
          description: 처리 중 예외
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "504":
          description: 전체 처리 시한 초과
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

components:
  headers:
    X-Request-Id:
      description: 요청 ID. SearchResponse·ErrorBody의 request_id와 같은 값.
      schema: { $ref: "#/components/schemas/RequestId" }
    Retry-After:
      description: 다시 시도까지 남은 초(정수). Traefik 429 또는 상세 503에서 보낼 수 있다.
      schema: { type: integer, minimum: 1 }

  schemas:
    DomainKey:
      type: string
      enum: [bond, kr_etf, kr_etn, xx_etf, xx_etn, fund]
    Outcome:
      type: string
      enum:
        [
          answered,
          caveat,
          no_result,
          not_collected,
          unread,
          unavailable,
          ambiguous,
          refused,
          error,
        ]
    EvidenceStatus:
      type: string
      enum: [FOUND, PARTIAL, EMPTY, AXIS_ABSENT, AMBIGUOUS]
    GeneratedBy:
      description: |
        GenerationOutcome.generation_mode: LLM_GENERATED→llm, DETERMINISTIC_TEMPLATE→template,
        LLM_ERROR→fallback. [r9] 문장 검증에서 걸려 템플릿 문장으로 마무리한 답도 llm이다.
      type: string
      enum: [llm, template, fallback]
    ClarifyKind:
      type: string
      enum: [missing_condition, domain_context, product_context, listing_market]
    TraceStage:
      type: string
      enum:
        [
          route,
          llm_parse,
          query,
          compute,
          gate,
          verify,
          generate,
          suggest,
          render,
        ]
    ColumnKind:
      description: |
        화면 정렬·표시 종류. money·percent·return·count는 숫자(오른쪽 정렬).
        view_columns.format_kind 매핑: amount·price→money, ratio→percent, return→return,
        risk_grade→grade, count(일수 포함)→count, date→date, 상품코드→code, 참거짓→bool, 그 밖→text.
      type: string
      enum: [text, code, money, percent, return, count, grade, date, bool]
    ValueSource:
      description: Evidence `src` 값 그대로. 웹 표기 원천값·외부 수집·계산값·미제공.
      type: string
      enum: [system-provided, external, computed, unavailable]
    IsoDate:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    Scalar:
      type: [string, number, boolean, "null"]
    RequestId:
      description: |
        요청 ID. 서버는 UUIDv4로 만들지만 계약은 형식만 고정한다(영숫자·`-`·`_`, 1~64자).
        `X-Request-Id` 헤더, `SearchResponse.request_id`, `ErrorBody.request_id`가 이 형식을 공유한다.
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"

    SearchRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          description: |
            [r9] 원래 질문 1,000자 이하. NFKC·공백 정리한 길이가 1~200자가 아니면 422.
          minLength: 1
          maxLength: 1000

    ErrorBody:
      description: |
        앱이 내는 4xx·5xx 본문(검색 500은 제외 — SearchResponse). 세 필드 모두 필수.
        Traefik이 직접 내는 429는 이 형식이 아니라 text/plain일 수 있다.
        code별 HTTP: invalid_question 422 · timeout 504 · unknown_domain 404 ·
        product_not_found 404 · unavailable 503 · internal 500.
      type: object
      required: [code, message, request_id]
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            [
              invalid_question,
              timeout,
              unknown_domain,
              product_not_found,
              unavailable,
              internal,
            ]
        message: { type: string, minLength: 1 }
        request_id: { $ref: "#/components/schemas/RequestId" }

    Notice:
      type: object
      required: [code, text]
      additionalProperties: false
      properties:
        code: { type: string, description: "39 §2-5 notice 코드 표의 값" }
        text: { type: string, minLength: 1 }

    Answer:
      type: object
      required: [text, generated_by, notices]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 600
          description: "평문 최대 5문장·600자. Markdown·HTML 없음. 웹은 그대로 그린다. [r9] 결과 비교 요약 허용"
        generated_by: { $ref: "#/components/schemas/GeneratedBy" }
        notices:
          type: array
          items: { $ref: "#/components/schemas/Notice" }

    InterpretedDomain:
      type: object
      required: [domain, label, status, base_date]
      additionalProperties: false
      properties:
        domain: { $ref: "#/components/schemas/DomainKey" }
        label: { type: string }
        status: { $ref: "#/components/schemas/EvidenceStatus" }
        base_date:
          description: 그 상품군의 기준일. 단일 as_of는 없다.
          oneOf:
            - { $ref: "#/components/schemas/IsoDate" }
            - { type: "null" }

    Condition:
      type: object
      required: [axis, label, op, value, display]
      additionalProperties: false
      properties:
        axis:
          {
            type: string,
            description: "뷰 컬럼 키(view_columns 정본) 또는 관계 축(holding 등)",
          }
        label: { type: string }
        op:
          type: string
          enum: ["=", "!=", "<", "<=", ">", ">=", contains, in, between]
        value: { $ref: "#/components/schemas/Scalar" }
        display:
          {
            type: string,
            description: "서버가 만든 칩 문구. 예: 총보수 < 0.2%",
          }

    Sort:
      type: object
      required: [axis, label, dir]
      additionalProperties: false
      properties:
        axis: { type: string }
        label: { type: string }
        dir: { type: string, enum: [asc, desc] }

    MappingSlot:
      description: 질문 표현이 무엇으로 해석됐는가
      type: string
      enum: [domain, condition, sort, limit, aggregate, entity, time, policy]
    MappingMethod:
      description: |
        어떤 장치로 해석했는가. synonym=온톨로지 동의어·범주 값 사전, pattern=숫자·단위·등급
        모양, rule=라우팅 규칙(상장시장 좁히기 등), entity=엔티티 사전 일치, default=질문에
        없어 기본값을 씀. [r9] llm=규칙이 못 읽은 부분을 LLM이 읽고 코드 검사를 통과함
      type: string
      enum: [synonym, pattern, rule, entity, default, llm]
    InterpretationMapping:
      description: |
        [r6] 해석 과정 한 줄. "질문의 이 부분 → 이렇게 읽음 → 이 장치로".
        start·end는 정규화한 question의 문자(code point) 위치, [start, end). 질문에 없는
        해석(기본값·추론)은 text·start·end가 null.
      type: object
      required: [slot, text, start, end, result, method, note]
      additionalProperties: false
      properties:
        slot: { $ref: "#/components/schemas/MappingSlot" }
        text:
          {
            type: [string, "null"],
            description: "question[start:end]와 같은 문자열",
          }
        start: { type: [integer, "null"], minimum: 0 }
        end: { type: [integer, "null"], minimum: 0 }
        result:
          type: string
          minLength: 1
          description: 해석 결과 표시 문구. 예 "총보수 < 0.2%", "국내 ETF·국내 ETN", "상위 10"
        method: { $ref: "#/components/schemas/MappingMethod" }
        note:
          type: [string, "null"]
          description: 왜 이렇게 읽었는지 한 줄. 예 "상장시장 낱말이 없으면 국내 상장으로 좁힘"

    GraphState:
      description: |
        ok=정상, empty=조건 적용 후 0건, absent=수집하지 않은 축, blocked=저장소 장애,
        ambiguous=기준이 모호해 선택 필요, [r9] unread=이 구절을 조건으로 읽지 못해 조회하지 않음
      type: [string, "null"]
      enum: [ok, empty, absent, blocked, ambiguous, unread, null]
    GraphNode:
      description: |
        [r8] 탐색 그래프 노드. concept=온톨로지 클래스, individual=온톨로지 값(NamedIndividual·
        sh:in 값), set=조건을 적용한 상품 집합(건수), product=결과 상품, entity=지식그래프
        엔티티(구성종목·업종·운용사·기업집단·지수).
      type: object
      required:
        [
          id,
          kind,
          label,
          iri,
          count,
          domain,
          product_id,
          cited,
          entity_type,
          mapping,
          state,
        ]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9_-]{1,32}$" }
        kind:
          { type: string, enum: [concept, individual, set, product, entity] }
        label: { type: string, minLength: 1, maxLength: 60 }
        iri:
          {
            type: [string, "null"],
            description: "접두 IRI(fp:ETF 등). concept·individual만",
          }
        count:
          {
            type: [integer, "null"],
            minimum: 0,
            description: "set만. 그 단계까지 남은 상품 수",
          }
        domain:
          oneOf:
            - { $ref: "#/components/schemas/DomainKey" }
            - { type: "null" }
        product_id:
          {
            type: [string, "null"],
            description: "product만. /v1/products 경로 id",
          }
        cited:
          {
            type: boolean,
            description: "product가 답변에 인용됐는가. 그 밖은 false",
          }
        entity_type:
          type: [string, "null"]
          enum:
            [
              Constituent,
              BusinessGroup,
              Issuer,
              Manager,
              Industry,
              Ksic,
              Index,
              null,
            ]
          description: "entity만. mafest 그래프 노드 label(Index는 etf:BaseIndex)"
        mapping:
          {
            type: [integer, "null"],
            minimum: 0,
            description: "interpretation.mappings 번호(0부터)",
          }
        state: { $ref: "#/components/schemas/GraphState" }
    GraphEdge:
      type: object
      required: [from, to, kind, label, mapping, weight, state]
      additionalProperties: false
      properties:
        from: { type: string }
        to: { type: string }
        kind:
          type: string
          enum: [subclass, property, scope, constraint, member, relation]
          description: |
            subclass=하위 클래스→상위 클래스, property=클래스→값(온톨로지 속성), scope=클래스→첫 상품 집합,
            constraint=집합→좁힌 집합, member=집합→상품, relation=지식그래프 관계(HOLDS 등)
        label:
          {
            type: [string, "null"],
            maxLength: 40,
            description: "property 이름(listedOn)·관계 유형(HOLDS)",
          }
        mapping: { type: [integer, "null"], minimum: 0 }
        weight: { type: [string, "null"], description: "관계 표시값. 예 24.1%" }
        state: { $ref: "#/components/schemas/GraphState" }
    SearchGraph:
      description: |
        [r8] 탐색 그래프. 질문에 쓴 온톨로지 개념 → 조건마다 줄어드는 상품 집합 → 결과 상품 →
        지식그래프 관계. 질문에 쓰지 않은 개념은 넣지 않는다. 못 만들면 nodes·edges 모두 [].
      type: object
      required: [nodes, edges]
      additionalProperties: false
      properties:
        nodes:
          {
            type: array,
            maxItems: 40,
            items: { $ref: "#/components/schemas/GraphNode" },
          }
        edges:
          {
            type: array,
            maxItems: 60,
            items: { $ref: "#/components/schemas/GraphEdge" },
          }

    Interpretation:
      type: object
      required: [domains, conditions, sort, limit, mappings, graph]
      additionalProperties: false
      properties:
        graph: { $ref: "#/components/schemas/SearchGraph" }
        mappings:
          type: array
          maxItems: 20
          description: |
            [r6] 해석 과정. 질문 순서(start 오름차순), 질문에 없는 해석은 맨 뒤.
            서버가 아직 기록하지 못하면 []. 웹은 []이면 해석 결과만 보여준다.
          items: { $ref: "#/components/schemas/InterpretationMapping" }
        domains:
          type: array
          items: { $ref: "#/components/schemas/InterpretedDomain" }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/Condition" }
        sort:
          oneOf:
            - { $ref: "#/components/schemas/Sort" }
            - { type: "null" }
        limit:
          oneOf:
            - { type: integer, minimum: 1, maximum: 20 }
            - { type: "null" }

    Column:
      type: object
      required: [key, label, kind, emphasis]
      additionalProperties: false
      properties:
        key: { type: string }
        label: { type: string }
        kind: { $ref: "#/components/schemas/ColumnKind" }
        emphasis:
          type: boolean
          description: 정렬 축·조건 축이면 true. 모바일 카드는 강조 열 2개+등급 열만 싣는다.

    CellValue:
      type: object
      required: [display, raw, src, note]
      additionalProperties: false
      properties:
        display:
          type: string
          description: 서버가 포맷한 문자열(formatting.py). 수익률은 부호 포함(+12.3% / -4.1%).
        raw: { $ref: "#/components/schemas/Scalar" }
        src: { $ref: "#/components/schemas/ValueSource" }
        note:
          type: [string, "null"]
          description: 이 값에 걸린 *_note 문장(view_columns.note_guard). 없으면 null.

    ResultRow:
      type: object
      required: [product_id, name, cited, values]
      additionalProperties: false
      properties:
        product_id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string }
        cited:
          type: boolean
          description: 답변 문장이 인용한 ref(검증 통과)면 true
        values:
          type: object
          description: 키는 같은 묶음의 columns[].key 안에 있어야 한다(없는 열 값 금지).
          additionalProperties: { $ref: "#/components/schemas/CellValue" }

    ResultGroup:
      type: object
      required: [domain, total_count, truncated, columns, rows]
      additionalProperties: false
      properties:
        domain: { $ref: "#/components/schemas/DomainKey" }
        total_count: { type: integer, minimum: 0 }
        truncated: { type: boolean, description: "total_count > rows 개수" }
        columns:
          type: array
          items: { $ref: "#/components/schemas/Column" }
        rows:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ResultRow" }

    QuestionOption:
      type: object
      required: [label, question]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 20 }
        question:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
          description: 그대로 /v1/search에 다시 보낼 완결된 질문(공백만으로 된 문자열 금지)

    Clarify:
      type: object
      required: [kind, reason, options]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/ClarifyKind" }
        reason: { type: string }
        options:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: "#/components/schemas/QuestionOption" }

    TraceStep:
      type: object
      required: [stage, label, ms, detail, query]
      additionalProperties: false
      properties:
        stage: { $ref: "#/components/schemas/TraceStage" }
        label: { type: string }
        ms: { type: number, minimum: 0 }
        detail: { type: [string, "null"] }
        query:
          type: [string, "null"]
          description: |
            기본값 null. 공개 스위치가 켜져 있고 쿼리 모양이 공개 allowlist를 통과할 때만
            parameterized SQL·Cypher를 자리표시자(`$1`, `$name`) 그대로 싣는다.
            매개변수 값(`-- $1 = …` 주석 포함)은 어떤 경우에도 붙이지 않는다.
            DSN·호스트·포트·DB 사용자명·내부 IP·Secret·파일 경로·원천 행 전체를 넣지 않는다.

    Trace:
      description: |
        "어떻게 답했나" 패널용 공개 실행 기록. 질문 원문은 SearchResponse.question에만 있고
        trace에는 다시 싣지 않는다. 집계 질문(개수·합계·평균)은 compute 단계에 결과를 적는다.
      type: object
      required: [elapsed_ms, model, tokens, steps]
      additionalProperties: false
      properties:
        elapsed_ms: { type: number, minimum: 0 }
        model:
          { type: [string, "null"], description: "LLM을 부르지 않았으면 null" }
        tokens:
          oneOf:
            - type: object
              required: [prompt, completion]
              additionalProperties: false
              properties:
                prompt: { type: integer, minimum: 0 }
                completion: { type: integer, minimum: 0 }
            - { type: "null" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }

    SearchResponse:
      type: object
      required:
        [
          request_id,
          question,
          outcome,
          answer,
          interpretation,
          results,
          clarify,
          suggestions,
          trace,
        ]
      additionalProperties: false
      properties:
        request_id: { $ref: "#/components/schemas/RequestId" }
        question: { type: string, description: "정규화한 질문(앞뒤 공백 제거)" }
        outcome: { $ref: "#/components/schemas/Outcome" }
        answer: { $ref: "#/components/schemas/Answer" }
        interpretation: { $ref: "#/components/schemas/Interpretation" }
        results:
          type: array
          description: |
            표를 내는 outcome(answered·caveat)에서만 채운다. 단, 상품 행이 없는 집계 답
            (개수·합계·평균)은 answered·caveat이어도 `[]`이고 값은 answer.text와 trace compute
            단계에 있다. 그 밖 outcome은 반드시 `[]`.
          items: { $ref: "#/components/schemas/ResultGroup" }
        clarify:
          oneOf:
            - { $ref: "#/components/schemas/Clarify" }
            - { type: "null" }
        suggestions:
          type: array
          maxItems: 3
          description: |
            [r9] 이어서 물을 질문. answered·caveat에도 최대 3개(라우터를 통과한 것만).
            refused 정확히 2, no_result 1~2, not_collected·unread 0~2.
          items: { $ref: "#/components/schemas/QuestionOption" }
        trace:
          oneOf:
            - { $ref: "#/components/schemas/Trace" }
            - { type: "null" }
      allOf:
        # ambiguous ⇔ clarify 있음
        - if:
            properties: { outcome: { const: ambiguous } }
          then:
            properties: { clarify: { $ref: "#/components/schemas/Clarify" } }
          else:
            properties: { clarify: { type: "null" } }
        # 표를 내는 outcome은 answered·caveat뿐이다
        - if:
            properties:
              outcome:
                enum:
                  [
                    no_result,
                    not_collected,
                    unread,
                    unavailable,
                    ambiguous,
                    refused,
                    error,
                  ]
          then:
            properties: { results: { maxItems: 0 } }

    ProductField:
      type: object
      required: [key, label, kind, display, raw, src, note, as_of]
      additionalProperties: false
      properties:
        key: { type: string }
        label: { type: string }
        kind: { $ref: "#/components/schemas/ColumnKind" }
        display: { type: string, description: "미제공이면 —" }
        raw: { $ref: "#/components/schemas/Scalar" }
        src: { $ref: "#/components/schemas/ValueSource" }
        note: { type: [string, "null"] }
        as_of:
          oneOf:
            - { $ref: "#/components/schemas/IsoDate" }
            - { type: "null" }

    FieldGroup:
      type: object
      required: [key, label, fields]
      additionalProperties: false
      properties:
        key:
          type: string
          description: basic · cost · return · rate · risk · distribution · size · index 중 하나
        label: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ProductField" }

    RelationItem:
      type: object
      required: [id, name, display, question]
      additionalProperties: false
      properties:
        id: { type: [string, "null"] }
        name: { type: string }
        display: { type: [string, "null"], description: "비중 등. 예: 24.1%" }
        question:
          type: [string, "null"]
          description: 누르면 이어지는 검색 질문. null이면 웹이 이름으로 검색한다.

    Relation:
      type: object
      required: [type, label, items]
      additionalProperties: false
      properties:
        type: { type: string, enum: [holding, manager, issuer_group, index] }
        label: { type: string }
        items:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/RelationItem" }

    ProductDetail:
      type: object
      required: [domain, domain_label, product_id, name, groups, relations]
      additionalProperties: false
      properties:
        domain: { $ref: "#/components/schemas/DomainKey" }
        domain_label: { type: string }
        product_id: { type: string }
        name: { type: string }
        groups:
          type: array
          items: { $ref: "#/components/schemas/FieldGroup" }
        relations:
          type: array
          items: { $ref: "#/components/schemas/Relation" }

    MetaDomain:
      type: object
      required: [domain, label, count, base_date]
      additionalProperties: false
      properties:
        domain: { $ref: "#/components/schemas/DomainKey" }
        label: { type: string }
        count: { type: integer, minimum: 0 }
        base_date:
          oneOf:
            - { $ref: "#/components/schemas/IsoDate" }
            - { type: "null" }

    MetaExample:
      type: object
      required: [id, category, question, expected_outcome]
      additionalProperties: false
      properties:
        id:
          {
            type: string,
            description: "gold 문항 id(E03 등). sweep에서 기대 outcome이 확인된 것만",
          }
        category:
          {
            type: string,
            description: "칩 위 분류. 순위·복합 조건·개수·채권·수집 범위 밖·거절",
          }
        question: { type: string, maxLength: 200 }
        expected_outcome: { $ref: "#/components/schemas/Outcome" }

    Meta:
      type: object
      required: [domains, examples, llm_available]
      additionalProperties: false
      properties:
        domains:
          type: array
          items: { $ref: "#/components/schemas/MetaDomain" }
        examples:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/MetaExample" }
        llm_available:
          type: boolean
          description: vLLM /v1/models 확인 결과(10초 캐시, 2초 시한)

    # ── [1.4.0] 개념 설명 ───────────────────────────────────
    ExplainRequest:
      description: 최종 검색 응답의 interpretation에서 뽑은 값. 질문 원문은 담지 않는다.
      type: object
      required: [domains, axes, sort_axis]
      additionalProperties: false
      properties:
        domains:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items: { $ref: "#/components/schemas/DomainKey" }
        axes:
          description: 적용된 조건 축 키(Condition.axis). 중복 없이.
          type: array
          maxItems: 12
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        sort_axis:
          description: 적용된 정렬 축 키(Sort.axis). 정렬이 없으면 null.
          oneOf:
            - { type: string, minLength: 1, maxLength: 64 }
            - { type: "null" }
    ConceptSource:
      type: object
      required: [title, url]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 60 }
        url: { type: string, pattern: "^https?://\\S+$", maxLength: 300 }
    ConceptTopic:
      description: 검토된 설명 자료 한 주제. 일반 개념 설명이며 특정 상품의 조회 근거가 아니다.
      type: object
      required: [id, title, summary, detail, sources, reviewed_at]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[a-z0-9_]+$", maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 30 }
        summary: { type: string, minLength: 1, maxLength: 120 }
        detail: { type: string, minLength: 1, maxLength: 600 }
        sources:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/ConceptSource" }
        reviewed_at: { $ref: "#/components/schemas/IsoDate" }
    ExplainResponse:
      type: object
      required: [topics]
      additionalProperties: false
      properties:
        topics:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/ConceptTopic" }

    # ── [r9] 스트림 이벤트 data ─────────────────────────────
    StreamStart:
      type: object
      required: [request_id, question]
      additionalProperties: false
      properties:
        request_id: { $ref: "#/components/schemas/RequestId" }
        question: { type: string }
    StreamInterpretation:
      description: 해석 직후. interpretation.graph는 아직 빈 그래프(nodes·edges 모두 []).
      type: object
      required: [interpretation]
      additionalProperties: false
      properties:
        interpretation: { $ref: "#/components/schemas/Interpretation" }
    StreamResults:
      description: 조회·게이트·건수 집계 뒤. 탐색 그래프를 여기서 보낸다(상품 노드 cited는 모두 false, done에서 확정).
      type: object
      required: [outcome, results, clarify, graph]
      additionalProperties: false
      properties:
        outcome: { $ref: "#/components/schemas/Outcome" }
        graph: { $ref: "#/components/schemas/SearchGraph" }
        results:
          type: array
          items: { $ref: "#/components/schemas/ResultGroup" }
        clarify:
          oneOf:
            - { $ref: "#/components/schemas/Clarify" }
            - { type: "null" }
    StreamAnswerDelta:
      type: object
      required: [index, text]
      additionalProperties: false
      properties:
        index: { type: integer, minimum: 0, maximum: 4 }
        text: { type: string, minLength: 1 }
    StreamAnswerDone:
      type: object
      required: [answer]
      additionalProperties: false
      properties:
        answer: { $ref: "#/components/schemas/Answer" }
    StreamSuggestions:
      type: object
      required: [suggestions]
      additionalProperties: false
      properties:
        suggestions:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/QuestionOption" }
    StreamDone:
      type: object
      required: [response]
      additionalProperties: false
      properties:
        response: { $ref: "#/components/schemas/SearchResponse" }
